name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main # Change this to master if that is the name of your branch in GitHub Desktop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      # Standard clean npm installation step
      - name: Install dependencies
        run: npm ci

      # Deploys using your original, secure FIREBASE_TOKEN secret key structure
      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@v2.6.0
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main # This runs the automation every time you push code to your main branch

permissions:
  contents: read
  id-token: write # Required for keyless authentication on Spark plans

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Uses official Firebase action that maps folder contexts natively
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: 'github-action-1328673900@://gserviceaccount.com'
          channelId: live
